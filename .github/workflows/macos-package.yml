name: macOS Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runs_on }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: macos-14
            rid: osx-arm64
            triplet: arm64-osx
            arch: arm64
            artifact_dir: CxShell-macos-arm64
          - runs_on: macos-15-intel
            rid: osx-x64
            triplet: x64-osx
            arch: x64
            artifact_dir: CxShell-macos-x64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          version="1.0.0"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        shell: bash
        run: |
          brew install cmake ninja pkg-config

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}/downloads
            ${{ env.VCPKG_ROOT }}/installed
            ${{ env.VCPKG_ROOT }}/buildtrees
            ${{ env.VCPKG_ROOT }}/packages
          key: ${{ runner.os }}-${{ matrix.triplet }}-vcpkg-freerdp-${{ hashFiles('tools/build-rdp-bridge.sh', 'native/CxRdpBridge/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.triplet }}-vcpkg-freerdp-

      - name: Publish app
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          assembly_version="${version%%-*}"
          dotnet publish CxShell.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -o "artifacts/publish/${{ matrix.rid }}" \
            /p:Version="$version" \
            /p:AssemblyVersion="$assembly_version" \
            /p:FileVersion="$assembly_version" \
            /p:InformationalVersion="$version" \
            /p:PublishSingleFile=false \
            /p:DebugType=none \
            /p:DebugSymbols=false

      - name: Create app bundle
        shell: bash
        run: |
          export PUBLISH_DIR="$GITHUB_WORKSPACE/artifacts/publish/${{ matrix.rid }}"
          export ARTIFACT_DIR="$GITHUB_WORKSPACE/artifacts/${{ matrix.artifact_dir }}"
          export ARCH="${{ matrix.arch }}"
          export BUNDLE_VERSION="${{ steps.version.outputs.value }}"
          export BUNDLE_SHORT_VERSION="${{ steps.version.outputs.value }}"
          bash tools/package-macos-app.sh

      - name: Build RDP bridge
        shell: bash
        run: |
          export OUTPUT_DIR="$GITHUB_WORKSPACE/artifacts/${{ matrix.artifact_dir }}/CxShell.app/Contents/MacOS"
          export TRIPLET="${{ matrix.triplet }}"
          bash tools/build-rdp-bridge.sh

      - name: Build Finder drag bridge
        shell: bash
        run: |
          export OUTPUT_DIR="$GITHUB_WORKSPACE/artifacts/${{ matrix.artifact_dir }}/CxShell.app/Contents/MacOS"
          export ARCH="${{ matrix.arch }}"
          bash tools/build-macos-drag-bridge.sh

      - name: Clear downloaded file attributes
        shell: bash
        run: |
          xattr -cr "artifacts/${{ matrix.artifact_dir }}/CxShell.app" || true

      - name: Validate package
        shell: bash
        run: |
          app_path="artifacts/${{ matrix.artifact_dir }}/CxShell.app"
          test -x "$app_path/Contents/MacOS/CxShell"
          test -f "$app_path/Contents/Info.plist"
          test -f "$app_path/Contents/Resources/CxShell.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app_path/Contents/Info.plist")" = "CxShell"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app_path/Contents/Info.plist")" = "CxShell"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app_path/Contents/Info.plist")" = "CxShell.icns"
          test -f "$app_path/Contents/MacOS/libCxRdpBridge.dylib"
          test -f "$app_path/Contents/MacOS/libCxMacDragBridge.dylib"
          if [ -d "$app_path/Contents/MacOS/runtimes/win-x64" ]; then
            echo "Windows native runtime files were copied into the macOS package." >&2
            exit 1
          fi
          otool -L "$app_path/Contents/MacOS/libCxRdpBridge.dylib"
          otool -L "$app_path/Contents/MacOS/libCxMacDragBridge.dylib"

      - name: Create Velopack package
        shell: bash
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          export APP_PATH="$GITHUB_WORKSPACE/artifacts/${{ matrix.artifact_dir }}/CxShell.app"
          export PACK_ID="CxShell-$rid"
          export PACK_VERSION="${{ steps.version.outputs.value }}"
          export PACK_CHANNEL="$rid"
          export PACK_RUNTIME="$rid"
          export PACK_TITLE="CxShell"
          export OUTPUT_DIR="$GITHUB_WORKSPACE/artifacts/velopack/$rid"
          bash tools/package-macos-velopack.sh

      - name: Create archive
        shell: bash
        run: |
          tar -czf "artifacts/${{ matrix.artifact_dir }}.tar.gz" -C artifacts "${{ matrix.artifact_dir }}"

      - name: Create DMG
        shell: bash
        run: |
          export APP_PATH="$GITHUB_WORKSPACE/artifacts/${{ matrix.artifact_dir }}/CxShell.app"
          export OUTPUT_DMG="$GITHUB_WORKSPACE/artifacts/${{ matrix.artifact_dir }}.dmg"
          export VOLUME_NAME="CxShell ${{ matrix.arch }}"
          export README_SOURCE="$GITHUB_WORKSPACE/artifacts/${{ matrix.artifact_dir }}/README-macos.txt"
          bash tools/create-macos-dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_dir }}
          path: |
            artifacts/${{ matrix.artifact_dir }}.tar.gz
            artifacts/${{ matrix.artifact_dir }}.dmg
            artifacts/velopack/${{ matrix.rid }}/**
          if-no-files-found: error
